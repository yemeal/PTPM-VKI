[project]
name = "ptpm-vki"
version = "0.1.0"
description = ""
authors = [
    { name = "yemeal", email = "emelyalex@bk.ru" }
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "dishka>=1.10.1",
    "fastapi (>=0.141.1,<0.142.0)",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings>=2.16.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
]

[dependency-groups]
dev = [
    "ruff (>=0.16.7,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    "httpx2 (>=2.10.0,<3.0.0)",
    "ty (>=0.0.80,<0.0.81)",
    "prek (>=0.5.3,<0.6.0)",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode in strings
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty]

[tool.ty.environment]
root = ["./src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
    "integration: test that crosses an application or adapter boundary",
]
filterwarnings = [
    # Игнорировать устаревший алиас AnyIO именно в Starlette TestClient:
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\\.testclient",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
