[project]
name = "ptpm-vki"
version = "0.1.0"
description = ""
authors = [
    { name = "yemeal", email = "emelyalex@bk.ru" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
]

[tool.poetry]
packages = [
    { include = "app", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.7,<0.17.0)",
    "ty (>=0.0.80,<0.0.81)",
    "pytest (>=9.1.1,<10.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
]


[tool.ruff]
line-length = 79
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode in strings
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = [
    # Игнорировать устаревший алиас AnyIO именно в Starlette TestClient:
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\\.testclient",
]

[tool.ty]

[tool.ty.environment]
root = ["./src", "."]